app:
  debug: true
  host: 127.0.0.1
  name: Local C++ AI - Algorithm & Logic Engine
  port: 8000
compiler:
  flags:
  - -O2
  - -Wall
  - -Wextra
  - -Wno-unused-result
  gpp_path: g++
  standard: c++17
  temp_dir: data/sandbox
llm:
  endpoint: http://127.0.0.1:11434
  max_tokens: 4096
  model: qwen2.5-coder:7b
  provider: ollama
  temperature: 0.2
  timeout_seconds: 120
  vision_model: qwen2.5vl:7b
memory:
  db_path: data/memory.db
  max_history_turns: 10
rag:
  embedding_mode: hybrid
  enabled: true
  knowledge_dir: data/knowledge_base
  top_k: 3
sandbox:
  max_output_length: 50000
  memory_limit_mb: 256
  timeout_seconds: 2.0
