<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nộp bài giải thuật toán | Local CP Studio</title>
    <meta name="description" content="Nộp giải pháp bài toán thuật toán và nhận kết quả chấm tự động từ hệ thống máy chấm Local CP Studio.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    
    <!-- Modular Stylesheets -->
    <link rel="stylesheet" href="css/arena.css?v=5.0">
    <link rel="stylesheet" href="css/submission.css?v=1.0">
    <link rel="stylesheet" href="css/glassmorphism-effects.css">
    <script src="js/theme.js"></script>
    <script src="js/glassmorphism.js"></script>
</head>
<body class="usaco-theme">
    <!-- Ambient Animated Mesh Background -->
    <div class="app-ambient" aria-hidden="true">
        <div class="orb orb-cyan"></div>
        <div class="orb orb-violet"></div>
        <div class="orb orb-emerald"></div>
        <div class="mesh-grid"></div>
    </div>
    <!-- Top Full-Width Header Bar -->
    <header class="site-header">
        <a class="brand" href="index.html">
            <span class="brand-mark">&lt;/&gt;</span> LOCAL CP
        </a>
        <nav class="top-nav">
            <a href="index.html">Trang chủ</a>
            <a href="problems.html">Kho bài tập</a>
            <a href="contest.html">Cuộc thi</a>
            <a href="standings.html">Bảng xếp hạng</a>
            <a class="active" href="submission.html">Nộp bài</a>
        </nav>
        <div style="display: flex; gap: 10px; align-items: center;">
            <div class="user-auth-area"></div>
            <button class="btn-theme-toggle" onclick="toggleTheme(event)" title="Chuyển chế độ Sáng / Tối">
                <i class="fa-solid fa-moon"></i> <span class="theme-label" style="font-size: 0.8rem; font-weight: 600;">Tối</span>
            </button>
            <a href="index.html#playground-tab" class="btn-back-ide">
                <i class="fa-solid fa-arrow-left"></i> Về IDE
            </a>
        </div>
    </header>

    <div class="arena">

        <!-- Breadcrumb Navigation -->
        <nav class="breadcrumb">
            <a href="index.html"><i class="fa-solid fa-house"></i> Trang chủ</a>
            <i class="fa-solid fa-chevron-right" style="font-size: 0.65rem;"></i>
            <a href="problems.html">Kho bài tập</a>
            <i class="fa-solid fa-chevron-right" style="font-size: 0.65rem;"></i>
            <span>Nộp bài giải</span>
        </nav>

        <!-- Main Submission Form Container -->
        <section class="submit-container-card">
            
            <!-- Card Header -->
            <div class="submit-header-kicker">SUBMISSION DESK</div>
            <h1 class="submit-header-title">Nộp bài giải thuật toán</h1>
            <div class="submit-divider"></div>

            <form id="submission-form" onsubmit="event.preventDefault(); submitSolution();">
                
                <!-- 1. Select Problem (Đề bài) -->
                <div class="submit-form-group">
                    <label class="submit-label" for="problem-select">
                        <i class="fa-solid fa-book-bookmark" style="color: var(--arena-primary); margin-right: 6px;"></i>
                        Chọn bài tập
                    </label>
                    <div class="submit-select-wrapper">
                        <select id="problem-select" class="submit-select">
                            <option value="p1">P001 · Tổng hai số nguyên lớn (A + B Problem)</option>
                            <option value="p2">P002 · Tìm dãy con liên tiếp có tổng lớn nhất</option>
                            <option value="p3">P003 · Đường đi ngắn nhất đồ thị trọng số dương (Dijkstra)</option>
                            <option value="p4">P004 · Bài toán Balo 0/1 (Knapsack Problem)</option>
                            <option value="p5">P005 · Đếm số hoán vị hợp lệ (Combinatorics)</option>
                            <option value="p6">P006 · Truy vấn tổng đoạn trên cây Segment Tree</option>
                        </select>
                        <i class="fa-solid fa-chevron-down submit-select-icon"></i>
                    </div>
                </div>

                <!-- 2. Select Language (Ngôn ngữ) -->
                <div class="submit-form-group">
                    <label class="submit-label" for="lang-select">
                        <i class="fa-solid fa-code" style="color: #a855f7; margin-right: 6px;"></i>
                        Ngôn ngữ lập trình
                    </label>
                    <div class="submit-select-wrapper">
                        <select id="lang-select" class="submit-select" onchange="changeLanguage(this.value)">
                            <option value="python" selected>Python 3 (Python 3.12+ Runtime)</option>
                            <option value="cpp">C++17 (g++ · Chuẩn thi đấu CP)</option>
                            <option value="c">C (gcc)</option>
                            <option value="java">Java (OpenJDK · Main class)</option>
                            <option value="go">Go (golang 1.21+)</option>
                            <option value="rust">Rust (rustc 2021)</option>
                            <option value="javascript">JavaScript (Node.js LTS)</option>
                            <option value="typescript">TypeScript (Node / ts-node)</option>
                            <option value="csharp">C# (.NET / csc)</option>
                            <option value="pascal">Pascal (Free Pascal / FPC)</option>
                        </select>
                        <i class="fa-solid fa-chevron-down submit-select-icon"></i>
                    </div>
                </div>

                <!-- 3. Monaco IDE Code Editor -->
                <div class="submit-form-group">
                    <label class="submit-label">
                        <i class="fa-solid fa-laptop-code" style="color: #22d3ee; margin-right: 6px;"></i>
                        Mã nguồn giải pháp
                    </label>

                    <div id="ide-container" class="ide-editor-container">
                        <!-- Top Toolbar of IDE Box -->
                        <div class="ide-editor-toolbar">
                            <div class="ide-tab-badge">
                                <i class="fa-solid fa-file-code" style="color: #38bdf8;"></i>
                                <span id="tab-filename">solution.cpp</span>
                            </div>
                            <button type="button" class="btn-ide-expand" onclick="toggleFullscreen()" title="Mở rộng / Toàn màn hình">
                                <i id="expand-icon" class="fa-solid fa-expand"></i>
                            </button>
                        </div>

                        <!-- Monaco Editor Mount Container -->
                        <div id="monaco-submit-editor" class="monaco-submission-host"></div>

                        <!-- Bottom Status Bar -->
                        <div class="ide-statusbar">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span class="ide-status-dot"></span>
                                <span id="ide-lang-label">C++17 (GCC 11.2)</span>
                            </div>
                            <div id="cursor-pos">Ln 1, Col 1</div>
                        </div>
                    </div>
                </div>

                <!-- 4. Big Submit Button -->
                <button type="submit" id="btn-submit" class="btn-big-submit">
                    Nộp bài!
                </button>

            </form>

            <!-- Result Box -->
            <div id="verdict-box" class="verdict-box">
                <div id="verdict-content"></div>
            </div>

        </section>

        <!-- Footer -->
        <footer class="footer">
            <span>&copy; 2026 <strong>Local CP Studio</strong> — Nền tảng Competitive Programming và thi đấu thuật toán.</span>
        </footer>
    </div>

    <!-- Modular Script Imports -->
    <script src="js/theme.js"></script>
    <script src="js/auth-nav.js"></script>
    <script src="js/submission.js?v=1.0"></script>
</body>
</html>
